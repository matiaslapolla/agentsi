[project]
name = "stt-eval"
version = "0.0.0"
description = "Throwaway harness: ONNX speech-to-text models against Hex"
requires-python = ">=3.12"
dependencies = ["onnx-asr[hub]", "numpy", "soundfile", "jiwer"]

[project.optional-dependencies]
cpu = ["onnxruntime"]
cuda = ["onnxruntime-gpu[cuda,cudnn]"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
