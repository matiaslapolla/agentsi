[project]
name = "agentsi-voice"
version = "0.2.0"
description = "AgentSI call audio renderer: script to Opus webm plus timings"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "piper-tts==1.8.0",
    "kokoro-onnx==0.6.1",
    "numpy>=2.5",
    "scipy>=1.18",
]

[project.scripts]
agentsi-voice = "agentsi_voice.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsi_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
