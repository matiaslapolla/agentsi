[package]
name = "agentsi-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Design system on gpui-component"

[dependencies]
# `#[derive(IntoElement)]` expands to `gpui::` paths. It is the same crate that `gpui-kit` re-exports.
gpui = { workspace = true }
gpui-kit = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
