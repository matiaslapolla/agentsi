[package]
name = "agentsi-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Window and screens"

[dependencies]
agentsi-proto = { workspace = true }
agentsi-term-view = { path = "../agentsi-term-view" }
agentsi-ui = { workspace = true }
cpal = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
gpui = { workspace = true }
# Without the `wayland` feature the window does not open.
gpui_platform = { workspace = true }
gpui-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The version that `toml` 0.8 uses: it keeps the comments of hosts.toml.
toml_edit = "=0.22.27"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
