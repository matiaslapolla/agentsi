name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Git identity for the commits the tests make
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: bubblewrap for the story session tests
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and bwrap needs them.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voice
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest
