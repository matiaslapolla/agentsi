name: Rust

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", "rust-toolchain.toml", "mise.toml", "deny.toml", "scripts/zig.sh", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.*", "rust-toolchain.toml", "mise.toml", "deny.toml", "scripts/zig.sh", ".github/workflows/rust.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0

# M1 builds Linux only. M2 adds a macOS job.
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libvulkan-dev libssl-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agentsi/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ hashFiles('crates/agentsi-vt/ghostty.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agentsi/ghostty
          key: ghostty-src-${{ runner.os }}-${{ hashFiles('crates/agentsi-vt/ghostty.lock') }}
      - name: Zig
        run: |
          echo "AGENTSI_ZIG=$(scripts/zig.sh)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('crates/agentsi-vt/ghostty.lock') }}
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
